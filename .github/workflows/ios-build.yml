name: iOS 构建与单测

# 用途：在没有 Mac 的开发机上验证「能不能编译、单测过不过」，并截出模拟器首页。
# 触发：push 到 main、PR、手动 Run workflow。
# 前提：仓库要镜像到 GitHub（Gitee 没有 macOS runner），见 Docs/03-无Mac编译与上线.md。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 编译 + 单测
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 工具与版本
        run: |
          brew install xcodegen xcbeautify
          xcodebuild -version
          xcodegen generate

      - name: 挑一个可用的模拟器
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for rt,v in d.items() if 'iOS' in rt for x in v if x.get('isAvailable')))")
          echo "使用模拟器 $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: 编译（模拟器版，不签名）
        id: compile
        run: |
          set -o pipefail
          xcodebuild build \
            -project BeanMan.xcodeproj \
            -scheme BeanMan \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | xcbeautify --renderer github-actions

      - name: 单元测试
        id: test
        run: |
          set -o pipefail
          xcodebuild test \
            -project BeanMan.xcodeproj \
            -scheme BeanMan \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log | xcbeautify --renderer github-actions

      # 编译失败时，把带文件名和行号的错误单独摘出来——不用逐行翻日志
      - name: 摘出编译错误
        if: failure()
        run: |
          {
            echo "## 编译 / 测试错误"
            echo '```'
            grep -E "(error|warning): |^.*\.swift:[0-9]+:[0-9]+: error" build.log test.log 2>/dev/null \
              | grep -v "^ld: warning" | head -80 || echo "没有匹配到 error: 行，去看 xcodebuild-log 产物"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传完整日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            build.log
            test.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传模拟器 App
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-simulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/BeanMan.app
          retention-days: 7

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 14

  screenshots:
    name: 模拟器截图
    needs: build
    # 只在手动触发或打标签时跑：截图每次要多花 4–6 分钟，日常 push 不需要
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    timeout-minutes: 25
    # 截图是可选的：即使失败也不该让主流程变红，但结果仍可下载
    continue-on-error: true

    steps:
      - name: 检出代码（取 Info.plist 里的 bundle id）
        uses: actions/checkout@v4

      - name: 下载模拟器 App
        uses: actions/download-artifact@v4
        with:
          name: app-simulator
          path: app

      - name: 挑一个可用的模拟器
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for rt,v in d.items() if 'iOS' in rt for x in v if x.get('isAvailable')))")
          echo "使用模拟器 $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: 启动模拟器并截图
        run: |
          set -x
          UDID="${{ steps.sim.outputs.udid }}"
          mkdir -p shots

          # 产物解压后的层级不稳定：可能多包一层目录，也可能把 .app 里的内容平铺出来
          ls -R app | head -40
          APP=$(find app -maxdepth 4 -name "BeanMan.app" -type d | head -1)
          if [ -z "$APP" ] && [ -f app/Info.plist ]; then
            echo "产物是平铺的，重组成 BeanMan.app"
            mkdir -p app/BeanMan.app
            find app -mindepth 1 -maxdepth 1 ! -name "BeanMan.app" -exec mv {} app/BeanMan.app/ \;
            APP=app/BeanMan.app
          fi
          echo "APP=$APP"
          ls -la "$APP" | head -30
          # 诊断：资源目录里到底有没有 Juzi 这张图
          if [ -f "$APP/Assets.car" ]; then
            echo "Assets.car 存在"
            xcrun --sdk iphonesimulator assetutil --info "$APP/Assets.car" 2>/dev/null | grep -i -E 'juzi|Name' | head -20 || true
          else
            echo "!! 没有 Assets.car"
          fi
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          echo "BUNDLE_ID=$BUNDLE_ID"

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          # 状态栏做成 9:41，截图更像设计稿
          xcrun simctl status_bar "$UDID" override \
            --time "9:41" --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 --wifiBars 3 || true

          xcrun simctl install "$UDID" "$APP"

          # ① 首次启动：拍引导页
          xcrun simctl launch "$UDID" "$BUNDLE_ID" || echo "启动失败，截桌面"
          sleep 6
          xcrun simctl io "$UDID" screenshot shots/01-onboarding.png || true

          # ② 带 -skipOnboarding 重启：拍今日页
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          sleep 1
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -skipOnboarding || echo "带参数启动失败"
          sleep 6
          xcrun simctl io "$UDID" screenshot shots/02-today.png || true

          # 如果启动崩了，把崩溃日志抓出来（比看截图有用）
          xcrun simctl spawn "$UDID" log show --last 3m --style compact \
            --predicate 'process == "BeanMan"' 2>/dev/null | tail -80 \
            > shots/app-log.txt || true

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: warn
          retention-days: 14