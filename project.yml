# XcodeGen 工程描述。
# Mac 上：brew install xcodegen && xcodegen generate
# 生成 BeanMan.xcodeproj（生成物，默认不进仓库；想进仓库就在 .gitignore 里放开两行）。
#
# 好处：新增 .swift 文件不用改工程文件，Windows 侧也能加文件，pbxproj 永不冲突。

name: BeanMan
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"          # 切片期先用 Swift 5，全功能齐了再切 6
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""          # 本地填自己的 Team ID，别提交
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  BeanMan:
    type: application
    platform: iOS
    sources:
      - path: BeanMan
    info:
      path: BeanMan/Info.plist
      properties:
        CFBundleDisplayName: 豆卡单词
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # 无网络传输、无自定义加密：声明后上传时不再每次回答出口合规问题
        ITSAppUsesNonExemptEncryption: false
        # 本地通知：首次使用时用 UNUserNotificationCenter 请求授权，不需要 Info.plist key
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.beanman
        PRODUCT_NAME: BeanMan
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  BeanManTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BeanManTests
    dependencies:
      - target: BeanMan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.beanman.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BeanMan:
    build:
      targets:
        BeanMan: all
        BeanManTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - BeanManTests