<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 竹竹 · 熊猫 v1.3 ｜ 豆卡单词
       ink #3A2A22 / fur #FFFFFF / blush #F3A183 -->
  <defs>
    <path id="bodyShape" d="M 330 716 C 312 840 348 900 392 906 L 632 906 C 676 900 712 840 694 716
                          C 682 634 604 600 512 600 C 420 600 342 634 330 716 Z"/>
    <clipPath id="bodyClip"><use href="#bodyShape"/></clipPath>
  </defs>

  <!-- 身体填充 -->
  <use href="#bodyShape" fill="#FFFFFF"/>

  <!-- 黑色肩带（裁进身体轮廓；外边界故意超出，避免露白缝） -->
  <g clip-path="url(#bodyClip)" fill="#3A2A22">
    <path d="M 330 600 C 380 680 396 800 396 906 L 396 940 L 260 940 L 260 600 Z"/>
    <path d="M 694 600 C 644 680 628 800 628 906 L 628 940 L 764 940 L 764 600 Z"/>
  </g>

  <!-- 身体描边压在肩带上，清掉裁切毛边 -->
  <use href="#bodyShape" fill="none" stroke="#3A2A22" stroke-width="11" stroke-linejoin="round"/>

  <!-- 脚掌 -->
  <ellipse cx="452" cy="884" rx="54" ry="36" fill="#3A2A22"/>
  <ellipse cx="572" cy="884" rx="54" ry="36" fill="#3A2A22"/>

  <!-- 耳朵 -->
  <circle cx="338" cy="300" r="74" fill="#3A2A22"/>
  <circle cx="686" cy="300" r="74" fill="#3A2A22"/>

  <!-- 头 -->
  <ellipse cx="512" cy="500" rx="252" ry="230" fill="#FFFFFF" stroke="#3A2A22" stroke-width="11"/>

  <!-- 黑眼圈 -->
  <g fill="#3A2A22">
    <ellipse cx="416" cy="486" rx="62" ry="76" transform="rotate(-16 416 486)"/>
    <ellipse cx="608" cy="486" rx="62" ry="76" transform="rotate(16 608 486)"/>
  </g>

  <!-- 高光 -->
  <circle cx="424" cy="466" r="20" fill="#FFFFFF"/>
  <circle cx="616" cy="466" r="20" fill="#FFFFFF"/>
  <circle cx="404" cy="510" r="9" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="596" cy="510" r="9" fill="#FFFFFF" opacity="0.7"/>

  <!-- 鼻子 -->
  <path d="M 494 566 C 494 550 530 550 530 566 C 530 582 512 592 512 592
           C 512 592 494 582 494 566 Z" fill="#3A2A22"/>

  <!-- 嘴 -->
  <path d="M 512 592 L 512 608 M 512 608 C 512 628 492 638 480 628 M 512 608 C 512 628 532 638 544 628"
        fill="none" stroke="#3A2A22" stroke-width="9" stroke-linecap="round"/>

  <!-- 腮红 -->
  <g fill="#F3A183" opacity="0.5">
    <ellipse cx="356" cy="606" rx="46" ry="26"/>
    <ellipse cx="668" cy="606" rx="46" ry="26"/>
  </g>
</svg>