<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <path id="bodyShape" d="M 322 736 C 304 856 362 888 384 894 L 640 894 C 662 888 720 856 702 736 C 690 654 594 620 512.0 620 C 430 620 334 654 322 736 Z"/>
    <clipPath id="bodyClip"><use href="#bodyShape"/></clipPath>
    <ellipse id="headShape" cx="512" cy="480" rx="258" ry="246"/>
    <clipPath id="headClip"><use href="#headShape"/></clipPath>
  </defs>

  <!-- 身体：白底 → 黑肢 → 奶油肚 → 压描边（描边在头之前，头会盖住上沿） -->
  <use href="#bodyShape" fill="#FFF9F3"/>
  <g clip-path="url(#bodyClip)">
    
    <path d="M 304 694 C 348 752 384 836 384 934 L 304 934 Z" fill="#2E2420"/><path d="M 720 694 C 676 752 640 836 640 934 L 720 934 Z" fill="#2E2420"/>
    <ellipse cx="426" cy="898" rx="54" ry="30" fill="#2E2420"/><ellipse cx="598" cy="898" rx="54" ry="30" fill="#2E2420"/>
  </g>
  <ellipse cx="512.0" cy="780" rx="110" ry="82" fill="#FFF9F3" stroke="none"/>
  <use href="#bodyShape" fill="none" stroke="#3A2A22" stroke-width="11"/>

  <!-- 耳朵在头之前 -->
  <circle cx="342" cy="283" r="84" fill="#2E2420" stroke="#3A2A22" stroke-width="11"/><circle cx="682" cy="283" r="84" fill="#2E2420" stroke="#3A2A22" stroke-width="11"/>

  <!-- 头 + 五官，全部裁进头轮廓 -->
  <use href="#headShape" fill="#FFF9F3"/>
  <g clip-path="url(#headClip)">
    <ellipse cx="404" cy="486" rx="76" ry="98" fill="#2E2420" transform="rotate(-12 404 486)"/><ellipse cx="620" cy="486" rx="76" ry="98" fill="#2E2420" transform="rotate(12 620 486)"/>
    <ellipse cx="402" cy="484" rx="30" ry="34" fill="#FFFFFF" stroke="none"/><circle cx="402" cy="486" r="16" fill="#241C17" stroke="none"/><circle cx="396" cy="475" r="5" fill="#FFFFFF" stroke="none"/><ellipse cx="622" cy="484" rx="30" ry="34" fill="#FFFFFF" stroke="none"/><circle cx="622" cy="486" r="16" fill="#241C17" stroke="none"/><circle cx="617" cy="475" r="5" fill="#FFFFFF" stroke="none"/>
    <ellipse cx="512.0" cy="593" rx="72" ry="49" fill="#FFF9F3" stroke="none"/><path d="M 482 559 Q 512 585 542 559" fill="none" stroke="#3A2A22" stroke-width="9" stroke-linecap="round"/><path d="M 512 581 L 512 609" fill="none" stroke="#3A2A22" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="347" cy="603" rx="38" ry="21" fill="#F3A183" opacity="0.55" stroke="none"/><ellipse cx="677" cy="603" rx="38" ry="21" fill="#F3A183" opacity="0.55" stroke="none"/>
  </g>
  <use href="#headShape" fill="none" stroke="#3A2A22" stroke-width="11"/>
</svg>
