  <!-- 小圆耳 -->
  <circle cx="372" cy="648" r="42" fill="#A9744F" stroke="#3A2A22" stroke-width="10"/>
  <circle cx="652" cy="648" r="42" fill="#A9744F" stroke="#3A2A22" stroke-width="10"/>

  <!-- 眼睛 -->
