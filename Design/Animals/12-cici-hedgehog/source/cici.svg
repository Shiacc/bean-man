        fill="none" stroke="#3A2A22" stroke-width="9" stroke-linecap="round"/>

  <!-- 腮红 -->
  <g fill="#F3A183" opacity="0.55">
    <ellipse cx="400" cy="806" rx="38" ry="21"/>
    <ellipse cx="624" cy="806" rx="38" ry="21"/>
  </g>

  <!-- 前爪 -->
  <ellipse cx="450" cy="886" rx="46" ry="26" fill="#F6E6D2" stroke="#3A2A22" stroke-width="9"/>
  <ellipse cx="574" cy="886" rx="46" ry="26" fill="#F6E6D2" stroke="#3A2A22" stroke-width="9"/>
