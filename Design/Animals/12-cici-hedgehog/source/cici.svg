    <ellipse cx="442" cy="722" rx="33" ry="37" fill="#3A2A22"/>
    <ellipse cx="582" cy="722" rx="33" ry="37" fill="#3A2A22"/>
    <circle cx="430" cy="708" r="11" fill="#FFFFFF"/>
    <circle cx="570" cy="708" r="11" fill="#FFFFFF"/>
  </g>

  <!-- 鼻子 -->
  <circle cx="512" cy="782" r="25" fill="#3A2A22"/>
  <circle cx="504" cy="774" r="8" fill="#FFFFFF" opacity="0.8"/>

  <!-- 嘴 -->
