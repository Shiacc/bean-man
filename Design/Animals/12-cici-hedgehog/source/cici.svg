           C 694 610 610 578 512 578 C 414 578 330 610 316 700 Z"
        fill="#A9744F" stroke="#3A2A22" stroke-width="11" stroke-linejoin="round"/>

  <!-- 脸 -->
  <path d="M 512 604 C 416 604 358 664 368 760 C 376 842 436 884 512 884
           C 588 884 648 842 656 760 C 666 664 608 604 512 604 Z"
