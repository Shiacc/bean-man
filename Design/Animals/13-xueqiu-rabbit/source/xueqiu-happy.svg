    <path d="M 403.9 529.2 Q 440.0 494.0 476.1 529.2" fill="none" stroke="#3A2A22" stroke-width="11.0" stroke-linecap="round"/>
    <path d="M 547.9 529.2 Q 584.0 494.0 620.1 529.2" fill="none" stroke="#3A2A22" stroke-width="11.0" stroke-linecap="round"/>
    
    
  </g>

