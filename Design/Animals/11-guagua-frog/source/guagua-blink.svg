    <path d="M 628 892 C 652 900 666 916 672 930 L 630 930 L 620 912 Z"/>
  </g>

  <!-- 眼睛（凸在头顶） -->
  <circle cx="394" cy="330" r="96" fill="#7FB069" stroke="#3A2A22" stroke-width="11"/>
  <circle cx="630" cy="330" r="96" fill="#7FB069" stroke="#3A2A22" stroke-width="11"/>

  <!-- 头 -->
  <ellipse cx="512" cy="516" rx="252" ry="196" fill="#7FB069" stroke="#3A2A22" stroke-width="11"/>

  <!-- 眼球 -->
  <circle cx="394" cy="330" r="58" fill="#7FB069"/>
  <circle cx="630" cy="330" r="58" fill="#7FB069"/>
  <path d="M 366 338 Q 394 372 422 338" fill="none" stroke="#3A2A22" stroke-width="13" stroke-linecap="round"/>
  <path d="M 566 338 Q 594 372 622 338" fill="none" stroke="#3A2A22" stroke-width="13" stroke-linecap="round"/>

  <!-- 腮红 -->
  <g fill="#F3A183" opacity="0.55">
    <ellipse cx="330" cy="574" rx="46" ry="24"/>
    <ellipse cx="694" cy="574" rx="46" ry="24"/>
  </g>

  <!-- 大笑的嘴 -->
  <path d="M 392 570 C 440 670 584 670 632 570 C 560 596 464 596 392 570 Z"
