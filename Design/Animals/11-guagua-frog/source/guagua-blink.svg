  <path d="M 452 616 C 490 646 534 646 572 616" fill="#F3888C"/>

  <!-- 鼻孔 -->
  <circle cx="492" cy="548" r="8" fill="#3A2A22"/>
  <circle cx="532" cy="548" r="8" fill="#3A2A22"/>
</svg>