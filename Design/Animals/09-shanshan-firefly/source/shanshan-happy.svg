<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 闪闪 · 萤火虫 v1.0 ｜ 豆卡单词
       glow #F2C14E / body #6B5B3E / wing #FFE9A8 / outline #3A2A22 / blush #F3A183 -->

  <!-- 翅膀（半透明，画在身体后面） -->
  <ellipse cx="330" cy="520" rx="132" ry="80" transform="rotate(-24 330 520)"
           fill="#FFE9A8" opacity="0.55" stroke="#3A2A22" stroke-width="9"/>
  <ellipse cx="398" cy="676" rx="92" ry="54" transform="rotate(-8 398 676)"
           fill="#FFE9A8" opacity="0.55" stroke="#3A2A22" stroke-width="9"/>
  <ellipse cx="694" cy="520" rx="132" ry="80" transform="rotate(24 694 520)"
           fill="#FFE9A8" opacity="0.55" stroke="#3A2A22" stroke-width="9"/>
  <ellipse cx="626" cy="676" rx="92" ry="54" transform="rotate(8 626 676)"
           fill="#FFE9A8" opacity="0.55" stroke="#3A2A22" stroke-width="9"/>

  <!-- 身体（圆滚滚的虫子） -->
  <ellipse cx="512" cy="640" rx="168" ry="186" fill="#6B5B3E" stroke="#3A2A22" stroke-width="11"/>

  <!-- 尾灯 -->
  <ellipse cx="512" cy="780" rx="92" ry="70" fill="#F2C14E"/>
  <ellipse cx="512" cy="772" rx="58" ry="40" fill="#FFF3C4"/>

  <!-- 头 -->
  <circle cx="512" cy="400" r="128" fill="#6B5B3E" stroke="#3A2A22" stroke-width="11"/>

  <!-- 触角 -->
  <path d="M 452 300 C 420 246 380 232 358 244 M 572 300 C 604 246 644 232 666 244"
        fill="none" stroke="#3A2A22" stroke-width="10" stroke-linecap="round"/>
  <circle cx="352" cy="240" r="14" fill="#F2C14E" stroke="#3A2A22" stroke-width="7"/>
  <circle cx="672" cy="240" r="14" fill="#F2C14E" stroke="#3A2A22" stroke-width="7"/>

  <!-- 眼睛 -->
  <g>
    <path d="M 429.7 400.4 Q 462.0 368.4 494.3 400.4" fill="none" stroke="#3A2A22" stroke-width="11.0" stroke-linecap="round"/>
    <path d="M 529.7 400.4 Q 562.0 368.4 594.3 400.4" fill="none" stroke="#3A2A22" stroke-width="11.0" stroke-linecap="round"/>
    
    
  </g>

  <!-- 腮红 -->
  <g fill="#F3A183" opacity="0.55">
    <ellipse cx="404" cy="442" rx="34" ry="18"/>
    <ellipse cx="620" cy="442" rx="34" ry="18"/>
  </g>

  <!-- 笑 -->
  <path d="M 486 440 Q 512 462 538 440" fill="none" stroke="#3A2A22" stroke-width="9" stroke-linecap="round"/>
</svg>