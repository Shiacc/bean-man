<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 芝麻 · 仓鼠 v1.0 ｜ 豆卡单词
       fur #C9A227 / shade #A88316 / cream #FFF9F3 / ear #F6C1B4 / outline #3A2A22 / blush #F3A183 -->
  <defs>
    <style>
      .ln { stroke: #A39D93; stroke-linecap: round; fill: none; }
    </style>
  </defs>

  <!-- 身体（圆滚滚，比猫更矮更宽） -->
  <path d="M 336 720 C 316 838 372 912 512 912 C 652 912 708 838 688 720
           C 676 640 600 606 512 606 C 424 606 348 640 336 720 Z"
        fill="#C9A227" stroke="#3A2A22" stroke-width="11" stroke-linejoin="round"/>

  <!-- 肚子奶油色 -->
  <ellipse cx="512" cy="812" rx="126" ry="96" fill="#FFF9F3"/>

  <!-- 前爪 -->
  <ellipse cx="432" cy="888" rx="52" ry="34" fill="#FFF9F3" stroke="#3A2A22" stroke-width="10"/>
  <ellipse cx="592" cy="888" rx="52" ry="34" fill="#FFF9F3" stroke="#3A2A22" stroke-width="10"/>

  <!-- 耳朵：小圆耳，画在头后面 -->
  <circle cx="352" cy="326" r="62" fill="#C9A227" stroke="#3A2A22" stroke-width="11"/>
  <circle cx="672" cy="326" r="62" fill="#C9A227" stroke="#3A2A22" stroke-width="11"/>
  <circle cx="352" cy="330" r="34" fill="#F6C1B4"/>
  <circle cx="672" cy="330" r="34" fill="#F6C1B4"/>

  <!-- 头（仓鼠脸更扁更圆） -->
  <ellipse cx="512" cy="512" rx="262" ry="222" fill="#C9A227" stroke="#3A2A22" stroke-width="11"/>

  <!-- 腮帮子（两侧鼓起来） -->
  <ellipse cx="330" cy="588" rx="86" ry="74" fill="#C9A227" stroke="#3A2A22" stroke-width="11"/>
  <ellipse cx="694" cy="588" rx="86" ry="74" fill="#C9A227" stroke="#3A2A22" stroke-width="11"/>

  <!-- 脸中央奶油色 -->
  <ellipse cx="512" cy="596" rx="132" ry="112" fill="#FFF9F3"/>

  <!-- 眼睛 -->
  <g>
    <path d="M 376.5 494.1 Q 424.0 537.2 471.5 494.1" fill="none" stroke="#3A2A22" stroke-width="12.9" stroke-linecap="round"/><path d="M 370.5 486.1 L 358.5 474.1" fill="none" stroke="#3A2A22" stroke-width="7.7" stroke-linecap="round" opacity="0.85"/><path d="M 477.5 486.1 L 489.5 474.1" fill="none" stroke="#3A2A22" stroke-width="7.7" stroke-linecap="round" opacity="0.85"/>
    <path d="M 552.5 494.1 Q 600.0 537.2 647.5 494.1" fill="none" stroke="#3A2A22" stroke-width="12.9" stroke-linecap="round"/><path d="M 546.5 486.1 L 534.5 474.1" fill="none" stroke="#3A2A22" stroke-width="7.7" stroke-linecap="round" opacity="0.85"/><path d="M 653.5 486.1 L 665.5 474.1" fill="none" stroke="#3A2A22" stroke-width="7.7" stroke-linecap="round" opacity="0.85"/>
    
    
  </g>

  <!-- 腮红 -->
  <g fill="#F3A183" opacity="0.55">
    <ellipse cx="366" cy="612" rx="44" ry="24"/>
    <ellipse cx="658" cy="612" rx="44" ry="24"/>
  </g>

  <!-- 鼻子与嘴 -->
  <path d="M 496 566 C 496 552 528 552 528 566 C 528 580 512 590 512 590
           C 512 590 496 580 496 566 Z" fill="#3A2A22"/>
  <path d="M 512 590 L 512 604 M 512 604 C 512 622 494 630 482 622 M 512 604 C 512 622 530 630 542 622"
        fill="none" stroke="#3A2A22" stroke-width="8" stroke-linecap="round"/>

  <!-- 门牙 -->
  <g fill="#FFFFFF" stroke="#3A2A22" stroke-width="5" stroke-linejoin="round">
    <rect x="499" y="620" width="12" height="18" rx="4"/>
    <rect x="513" y="620" width="12" height="18" rx="4"/>
  </g>

  <!-- 胡子 -->
  <g class="ln" stroke-width="6">
    <path d="M 396 588 L 300 578"/>
    <path d="M 396 606 L 304 616"/>
    <path d="M 628 588 L 724 578"/>
    <path d="M 628 606 L 720 616"/>
  </g>
</svg>